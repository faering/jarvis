# Jarvis agent stack. The Tauri display app is native (not in Docker) and connects to
# ws://127.0.0.1:8000/ws. The devcontainer reaches the agent as ws://agent:8000/ws over
# the shared external network jarvis-net (created by the devcontainer's initializeCommand).
#
# Local model serving (dev): ollama (LLM) and speaches (STT + TTS), both OpenAI-compatible
# and reachable only on jarvis-net (ollama:11434, speaches:8000). The agent does not depend
# on them: it starts without them and its backends connect only when used.
name: jarvis

services:
  agent:
    build: ./agent
    image: jarvis-agent:dev
    restart: unless-stopped
    ports:
      # Loopback only: the display runs on the same host; no LAN use case yet.
      - "127.0.0.1:8000:8000"
    networks: [jarvis-net]
    environment:
      # Role backends (docs/architecture.md); override any of these in .env.
      JARVIS_LLM_BACKEND: ${JARVIS_LLM_BACKEND:-openai}
      JARVIS_LLM_BASE_URL: ${JARVIS_LLM_BASE_URL:-http://ollama:11434/v1}
      JARVIS_LLM_MODEL: ${JARVIS_LLM_MODEL:-qwen2.5:1.5b}
      JARVIS_LLM_API_KEY: ${JARVIS_LLM_API_KEY:-}
      JARVIS_STT_BACKEND: ${JARVIS_STT_BACKEND:-openai}
      JARVIS_STT_BASE_URL: ${JARVIS_STT_BASE_URL:-http://speaches:8000/v1}
      JARVIS_STT_MODEL: ${JARVIS_STT_MODEL:-Systran/faster-whisper-base.en}
      JARVIS_STT_API_KEY: ${JARVIS_STT_API_KEY:-}
      JARVIS_TTS_BACKEND: ${JARVIS_TTS_BACKEND:-openai}
      JARVIS_TTS_BASE_URL: ${JARVIS_TTS_BASE_URL:-http://speaches:8000/v1}
      JARVIS_TTS_MODEL: ${JARVIS_TTS_MODEL:-speaches-ai/piper-en_US-lessac-medium}
      JARVIS_TTS_VOICE: ${JARVIS_TTS_VOICE:-lessac}
      JARVIS_TTS_API_KEY: ${JARVIS_TTS_API_KEY:-}

  # LLM server. qwen2.5:1.5b is also in the Hailo-10H model zoo, so dev and Pi run the same
  # model.
  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    networks: [jarvis-net]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Optional NVIDIA GPU (needs the NVIDIA Container Toolkit); CPU is the default.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pulls the dev LLM into the ollama volume (~1 GB on first run), then exits.
  ollama-pull:
    image: ollama/ollama:0.34.3
    depends_on:
      ollama:
        condition: service_healthy
    networks: [jarvis-net]
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "qwen2.5:1.5b"]
    restart: "no"

  # STT (faster-whisper) + TTS (Piper) server. 0.9.0-rc.3 is a release candidate: the
  # newest release, and the one these model IDs were checked against. For a GPU, use the
  # matching -cuda tag plus the deploy snippet shown on ollama.
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    restart: unless-stopped
    networks: [jarvis-net]
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub
    environment:
      # Downloaded from Hugging Face on startup if missing (~200 MB on first run).
      PRELOAD_MODELS: '["Systran/faster-whisper-base.en", "speaches-ai/piper-en_US-lessac-medium"]'
      ENABLE_UI: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start waits for the model downloads above.
      start_period: 300s

volumes:
  ollama-models:
  speaches-models:

networks:
  jarvis-net:
    external: true
