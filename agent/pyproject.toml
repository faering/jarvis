[project]
name = "jarvis-agent"
# Managed by release-please (tag agent-vX.Y.Z); do not bump by hand.
version = "0.1.0"
description = "Jarvis agent/API layer: WebSocket API for the Tauri app, tools and routing."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.53",
  "pydantic>=2.13",
  "httpx>=0.28",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1",
  "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Container smoke tests build and run Docker: opt-in via `pytest -m container` (CI does).
# Live model tests need the model stack up: opt-in via `pytest -m models` (not in CI).
addopts = "-ra -m 'not container and not models'"
markers = [
  "container: builds and runs the real image via docker compose",
  "models: calls the real model servers of the local stack (docker compose up)",
]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py314"
