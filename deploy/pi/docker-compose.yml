# Jarvis agent stack ON THE PI, installed root-owned as /opt/jarvis/docker-compose.yml by the
# Pi setup (docs/pi-setup.md). Only scripts/deploy/jarvis-deploy-agent runs it, as root, with
# the released GHCR image; nothing is built here. Mirrors the root docker-compose.yml service,
# minus `build:`. The deploy user can't write it: whoever controls this file controls mounts.
#
#   docker compose -f /opt/jarvis/docker-compose.yml --env-file /var/lib/jarvis/agent.env up -d agent
#
# /var/lib/jarvis/agent.env is written by jarvis-deploy-agent and pins AGENT_IMAGE_TAG (a
# validated DOCKER_TAG from scripts/version.sh). Runtime config (JARVIS_* backends, API keys)
# goes in /opt/jarvis/agent.env (root, 600), same keys as the repo's .env.example.
# Log files (docs/logging.md): the host's /var/log/jarvis (root:jarvis-log 2775, from the Pi
# setup) is the only host path mounted; the agent writes it through the jarvis-log group.
name: jarvis

services:
  agent:
    # The repository is fixed here, not interpolated: only the tag comes from deploy state.
    image: ghcr.io/faering/jarvis-agent:${AGENT_IMAGE_TAG:?set by /var/lib/jarvis/agent.env}
    restart: unless-stopped
    env_file:
      - path: agent.env
        required: false
    environment:
      # Fixed here (wins over agent.env); JARVIS_LOG_LEVEL may be set in agent.env.
      JARVIS_LOG_DIR: /var/log/jarvis
    # jarvis-log's fixed GID (scripts/pi/setup.sh): write access to the log folder, nothing else.
    group_add: ["2750"]
    ports:
      # Loopback only: the display runs on the same host; no LAN use case yet.
      - "127.0.0.1:8000:8000"
    networks: [jarvis-net]
    volumes:
      # State store (JARVIS_STATE_DB, default /data/jarvis.db): survives redeploys.
      - jarvis-state:/data
      - /var/log/jarvis:/var/log/jarvis

volumes:
  jarvis-state:

networks:
  jarvis-net:
    external: true
