# Dependabot version updates. pip (agent/), npm (frontend/), and cargo
# (frontend/src-tauri/) are added when those packages are scaffolded.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # Its tag IS the Rust version it installs (e.g. @1.98.1), and Rust is bumped
      # deliberately (AGENTS.md); Dependabot proposed a nonexistent 1.120.0 (#170).
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
