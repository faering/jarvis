name: Claude Code

# Responds to "@claude" in an issue/PR comment, an inline review comment, or the body
# of a submitted PR review — then implements the change and pushes to the same branch.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per PR/issue. Don't cancel in flight: a half-finished push is worse than a wait.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # `comment.body` doesn't exist on pull_request_review; `review.body` doesn't exist on
    # the comment events. Check both so a submitted review triggers it too.
    #
    # The actor gate is defence-in-depth and cost control, not the security boundary:
    # claude-code-action already requires the triggering user to have write access and
    # rejects bot actors. Without it a runner still starts (burning minutes) before the
    # action rejects the caller.
    if: >-
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude')
      ) &&
      github.actor == 'faering'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push fixes to the PR branch
      pull-requests: write
      issues: write
      id-token: write # required for the Claude GitHub App auth
      actions: read # read CI results on the PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription-backed token; runs bill against the Claude plan, not the API.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
