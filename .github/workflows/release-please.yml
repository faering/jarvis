name: release-please

# Independent per-component releases from Conventional Commits. On every push to main,
# release-please opens/updates one release PR per component; NOTHING is tagged or
# released until a human merges that PR (and nothing is deployed — see #37/#38).
# Components (see release-please-config.json): agent (Python) -> tag agent-vX.Y.Z.
# The app (frontend/, tag app-vX.Y.Z) is added back to the config when it is
# scaffolded (#29). release-please attributes each commit to a component BY THE FILES
# IT TOUCHES — keep a commit within one component's path.
#
# Token: release PRs opened with the default GITHUB_TOKEN do not trigger other
# workflows, so CI (and the required `ci-ok` check) would never run on them. We use a
# fine-grained PAT in the RELEASE_PLEASE_TOKEN secret instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Mirrors the PAT's scopes (docs/release-please-token.md); issues:write is for the
# autorelease:* labels release-please puts on its PRs.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: require RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret RELEASE_PLEASE_TOKEN is not set (see docs/release-please-token.md)."
            exit 1
          fi
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Manifest-driven: reads release-please-config.json + .release-please-manifest.json.
      # release-please (<17.10.4, which the v5 action bundles) renders every commit's
      # issue reference as ", closes #n" — also `Refs #n` — so merging a release PR
      # closed issues that were only referenced (#185). Rewrite every closing keyword
      # in the open release PR bodies to "refs". Idempotent; runs after each update.
      # The release notes are built from the merged PR body, so they say "refs" too.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/release-please
      - name: release PR bodies reference issues, never close them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The release PRs this run created or updated. A PR created seconds ago can be
          # missing from the label listing below (#238: #235 kept "closes #233"), so
          # take them from release-please itself; the listing still catches the others.
          PRS: ${{ steps.release.outputs.prs || '[]' }}
        run: |
          prs="$( {
            jq -r '.[]?.number // empty' <<<"$PRS"
            gh pr list --state open --label "autorelease: pending" --json number -q '.[].number'
          } | sort -un)"
          [ -n "$prs" ] || echo "no open release PRs"
          for pr in $prs; do
            gh pr view "$pr" --json body -q .body > "$RUNNER_TEMP/body.md"
            python3 scripts/release-please/unclose_refs.py < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/fixed.md"
            if cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/fixed.md"; then
              echo "#$pr: no closing keywords"
            else
              gh pr edit "$pr" --body-file "$RUNNER_TEMP/fixed.md"
              echo "#$pr: closing keywords rewritten to refs"
            fi
          done
