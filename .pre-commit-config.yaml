# Standards enforced from commit #1. See docs / CLAUDE.md.
#   pre-commit stage  -> format + lint (fast, every commit)
#   commit-msg stage  -> Conventional Commits (commitizen)
#   pre-push stage     -> tests (kept off every commit to stay fast)
# Language-specific hooks are scoped with `files:` so they no-op until that code lands.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # ---- Hygiene ------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # pnpm-lock.yaml is a generated multi-document stream.
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
        # devcontainer.json is JSONC (allows // comments); skip strict JSON parse.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # ---- Python: lint + format ---------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # ---- Web (TS/JS/JSON/MD/YAML): format ----------------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.8
    hooks:
      - id: prettier
        files: ^(frontend|packages)/.*\.(ts|tsx|js|jsx|mjs|css|scss|html|json|md|ya?ml)$
        # Generated by release-please; reformatting it fails every release PR.
        exclude: (^|/)CHANGELOG\.md$

  # ---- Conventional Commits ----------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ---- Project-local hooks (activate when their files exist) --------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint + tsc (JS workspace)
        language: system
        entry: pnpm exec turbo run lint typecheck
        files: ^(frontend|packages)/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false

      - id: vitest
        name: vitest (JS workspace)
        language: system
        entry: pnpm exec turbo run test
        files: ^(frontend|packages)/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false
        stages: [pre-push]

      - id: rustfmt
        name: cargo fmt (src-tauri)
        language: system
        entry: bash -c 'cd frontend/src-tauri && cargo fmt --all -- --check'
        files: ^frontend/src-tauri/.*\.rs$
        pass_filenames: false

      - id: clippy
        name: cargo clippy (src-tauri)
        language: system
        entry: bash -c 'cd frontend/src-tauri && cargo clippy --all-targets -- -D warnings'
        files: ^frontend/src-tauri/.*\.rs$
        pass_filenames: false

      - id: pytest
        name: pytest (agent)
        language: system
        entry: bash -c 'cd agent && uv run --frozen --extra test pytest -q'
        files: ^agent/
        pass_filenames: false
        stages: [pre-push]

      - id: skills-unittest
        name: unittest (skill helpers)
        language: system
        entry: python3 -m unittest discover -s .claude/skills/_shared
        files: ^\.claude/skills/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: version-sh-test
        name: version.sh tests
        language: system
        entry: scripts/test_version.sh
        files: ^scripts/(version|test_version)\.sh$
        pass_filenames: false
        stages: [pre-push]

      - id: check-compat-test
        name: check-compat.sh tests
        language: system
        entry: scripts/deploy/test_check_compat.sh
        files: ^scripts/deploy/(check-compat|test_check_compat)\.sh$
        pass_filenames: false
        stages: [pre-push]

      - id: remote-deploy-test
        name: remote deploy script tests
        language: system
        entry: scripts/deploy/test_remote_deploy.sh
        files: ^scripts/deploy/(remote-agent|remote-app|remote-state|test_remote_deploy)\.sh$
        pass_filenames: false
        stages: [pre-push]
